    function CartDrawer({ open, onClose, items, onInc, onDec, onRemove, brand }) {
      // Parse price string like "₹280" into a number
      const parsePrice = (str) => {
        const n = String(str).replace(/[^0-9.]/g, "");
        return parseFloat(n) || 0;
      };

      // Calculate totals
      const subtotal = items.reduce(
        (sum, it) => sum + parsePrice(it.p) * it.qty,
        0
      );
      const tax = Math.round(subtotal * 0.05);
      const delivery = subtotal > 0 ? 40 : 0;
      const total = subtotal + tax + delivery;

      // Payment form state
      const [card, setCard] = useState("");
      const [expiry, setExpiry] = useState("");
      const [cvv, setCvv] = useState("");
      const [placed, setPlaced] = useState(false);

      // Reset confirmation when drawer closes
      useEffect(() => {
        if (!open) setPlaced(false);
      }, [open]);

      if (!open) return null;

      return (
        <>
          {/* Backdrop */}
          <div
            onClick={onClose}
            style={{
              position: "fixed",
              inset: 0,
              background: "rgba(0,0,0,0.5)",

            {[1, 2, 3, 4, 5, 6].map((i) => (
              <Card key={i} brand={brand}>
                <div style={{ fontFamily: brand.fontMono, fontSize: "0.65rem", letterSpacing: "0.2em", color: brand.accent, marginBottom: 20 }}>
                  / {String(i).padStart(2, "0")}
                </div>
                <h3 style={{ fontFamily: brand.font, fontSize: "1.3rem", fontWeight: 700, color: brand.text, marginBottom: 10 }}>
                  {route} {i}
                </h3>
                <p style={{ color: brand.muted, fontSize: "0.9rem", lineHeight: 1.7 }}>
                  Details for this item, written with the directness of a training plan.
                </p>
              </Card>
            ))}
          </div>
        </div>
      );
    }

    /* =========================================================
       BUSINESS 3 — SKINCARE ("Lumea")
       ========================================================= */
    function SkinHome({ brand }) {
      const cfg = DIVISION_CONFIG.skin.home;

      const [selectedTreatment, setSelectedTreatment] = useState(null);

      const seasonData = selectedTreatment
        ? {
            ...cfg.season,
            title: selectedTreatment.t,
            description: selectedTreatment.d,
            img: selectedTreatment.img || cfg.season.img,
            tag: "Selected Treatment",
            link: `${selectedTreatment.p} · ${cfg.season.link}`,
          }
        : cfg.season;

      return (
        <>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 20 }}>
            <Card brand={brand} style={{ padding: 48, minHeight: 400, display: "flex", flexDirection: "column", justifyContent: "space-between" }}>
              <div>
                <Eyebrow brand={brand}>{cfg.eyebrow}</Eyebrow>
                <h1 style={{ fontFamily: brand.font, fontSize: "clamp(2.4rem, 5vw, 4.4rem)", fontWeight: 400, lineHeight: 1.05, letterSpacing: "-0.02em", color: brand.text, marginBottom: 20 }}>
                  {cfg.heroTitle}
                </h1>
                <p style={{ fontSize: "1.05rem", color: brand.muted, lineHeight: 1.75, maxWidth: 460 }}>
                  {cfg.heroSubtitle}
                </p>
              </div>
              <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 32 }}>
                <Button brand={brand}>{cfg.primaryButton}</Button>
                <Button brand={brand} variant="outline">{cfg.secondaryButton}</Button>
              </div>
            </Card>

            <Card
              brand={brand}
              style={{
                background: brand.accentSoft,
                borderColor: brand.accentSoft,
                padding: 0,
                overflow: "hidden",
                display: "flex",
                flexDirection: "column",
                minHeight: 400,
              }}
            >
              {(() => {
                const offsetX = 0;
                const offsetY = 0;
                const zoom = 1;
                return (
                  <div
                    style={{
                      width: "100%",
                      height: 220,
                      overflow: "hidden",
                      position: "relative",
                      flexShrink: 0,
                    }}
                  >
                    <img
                      key={seasonData.img}
                      src={seasonData.img}
                      alt={seasonData.title}
                      style={{
                        position: "absolute",
                        top: 0,
                        left: 0,
                        width: "100%",
                        height: "100%",
                        objectFit: "cover",
                        display: "block",
                        transform: `translate(${offsetX}px, ${offsetY}px) scale(${zoom})`,
                        transformOrigin: "center center",
                        transition: "transform 0.3s ease, opacity 0.35s ease",
                        willChange: "transform",
                        animation: "fadeInImg 0.4s ease",
                      }}
                      onError={(e) => {
                        e.currentTarget.style.display = "none";
                      }}
                    />
                  </div>
                );
              })()}

              <div
                style={{
                  padding: 48,
                  paddingTop: 32,
                  display: "flex",
                  flexDirection: "column",
                  justifyContent: "space-between",
                  flex: 1,
                }}
              >
                <div>
                  <div style={{ fontFamily: brand.fontMono, fontSize: "0.65rem", letterSpacing: "0.2em", textTransform: "uppercase", color: brand.accent, marginBottom: 20 }}>
                    {seasonData.tag}
                  </div>
                  <h2 style={{ fontFamily: brand.font, fontSize: "2rem", fontWeight: 400, color: brand.text, lineHeight: 1.15, marginBottom: 12 }}>
                    {seasonData.title}
                  </h2>
                  <p style={{ fontSize: "0.95rem", color: brand.muted, lineHeight: 1.7 }}>
                    {seasonData.description}
                  </p>
                </div>
                <div style={{ fontFamily: brand.fontMono, fontSize: "0.72rem", color: brand.accent, letterSpacing: "0.15em", textTransform: "uppercase", marginTop: 20 }}>
                  {seasonData.link}
                </div>
              </div>
            </Card>
          </div>

          <div style={{ marginBottom: 20 }}>
            <Eyebrow brand={brand}>{cfg.sectionEyebrow}</Eyebrow>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 20, marginTop: 8 }}>
              {cfg.treatments.map((t, i) => {
                const isSelected = selectedTreatment && selectedTreatment.t === t.t;
                return (
                  <Card
                    key={t.t}
                    brand={brand}
                    onClick={() => setSelectedTreatment(isSelected ? null : t)}
                    style={{
                      borderColor: isSelected ? brand.accent : undefined,
                      background: isSelected
                        ? (brand.dark_mode ? "rgba(255,255,255,0.04)" : brand.accentSoft)
                        : undefined,
                    }}
                  >
                    <h3 style={{ fontFamily: brand.font, fontSize: "1.35rem", fontWeight: 400, color: brand.text, marginBottom: 8 }}>
                      {t.t}
                    </h3>
                    <p style={{ color: brand.muted, fontSize: "0.88rem", lineHeight: 1.65, marginBottom: 20 }}>
                      {t.d}
                    </p>
                    <div style={{ fontFamily: brand.font, fontSize: "1.5rem", color: brand.accent }}>
                      {t.p}
                    </div>
                  </Card>
                );
              })}
            </div>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 20 }}>
            {cfg.products.map((p) => (
              <Card key={p.n} brand={brand} style={{ textAlign: "center", padding: 24 }}>
                <div
                  style={{
                    width: "100%",
                    aspectRatio: 1,
                    borderRadius: 12,
                    overflow: "hidden",
                    background: `linear-gradient(135deg, ${brand.accentSoft} 0%, ${brand.accent} 100%)`,
                    marginBottom: 16,
                    position: "relative",
                  }}
                >
                  <img
                    src={p.img}
                    alt={p.n}
                    style={{
                      position: "absolute",
                      inset: 0,
                      width: "100%",
                      height: "100%",
                      objectFit: "cover",
                      display: "block",
                    }}
                    onError={(e) => {
                      e.currentTarget.style.display = "none";
                    }}
                  />
                </div>
                <div style={{ fontFamily: brand.font, fontSize: "1rem", color: brand.text }}>{p.n}</div>
              </Card>
            ))}
          </div>
        </>
      );
    }

    function SkinPage({ route, brand }) {
      const pages = DIVISION_CONFIG.skin.pages || {};
      const items = pages[route] || [];

      const heroTitle =
        route === "Treatments" && "Facials, rituals, and quiet time for your skin."
        || route === "Products" && "Hand-blended in small batches."
        || route === "Rituals" && "Small, daily practices for happy skin."
        || route === "Book" && "Find a time that suits you."
        || "";

      return (
        <div>
          <Eyebrow brand={brand}>{route}</Eyebrow>
          <h1 style={{ fontFamily: brand.font, fontSize: "clamp(2.4rem, 5vw, 4rem)", fontWeight: 400, color: brand.text, marginBottom: 20, lineHeight: 1.05 }}>
            {heroTitle}
          </h1>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 20, marginTop: 32 }}>
            {items.map((item, i) => (
              <Card key={i} brand={brand}>
                <div style={{ fontFamily: brand.fontMono, fontSize: "0.65rem", letterSpacing: "0.15em", color: brand.accent, marginBottom: 12 }}>
                  / {String(i + 1).padStart(2, "0")}
                </div>
                <h3 style={{ fontFamily: brand.font, fontSize: "1.4rem", fontWeight: 400, color: brand.text, marginBottom: 8 }}>
                  {item.n}
                </h3>
                <div style={{ fontFamily: brand.fontMono, fontSize: "0.7rem", letterSpacing: "0.12em", textTransform: "uppercase", color: brand.accent, marginBottom: 14 }}>
                  {item.d}
                </div>
                <p style={{ color: brand.muted, fontSize: "0.92rem", lineHeight: 1.75 }}>
                  {item.long}
                </p>
              </Card>
            ))}
          </div>
        </div>
      );
    }

    /* =========================================================
       FOOTER
       ========================================================= */
    function Footer({ brand }) {
      return (
        <footer
          style={{
            marginTop: 60,
            paddingTop: 40,
            borderTop: `1px solid ${brand.dark_mode ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.06)"}`,
            display: "grid",
            gridTemplateColumns: "2fr 1fr 1fr 1fr",
            gap: 40,
            flexWrap: "wrap",
          }}
        >
          <div>
            <div style={{ fontFamily: brand.font, fontSize: "1.3rem", fontWeight: 600, color: brand.text, marginBottom: 12 }}>
              {brand.name}
            </div>
            <p style={{ color: brand.muted, fontSize: "0.9rem", lineHeight: 1.7, maxWidth: 320 }}>
              {brand.tagline}
            </p>
          </div>
          {[
            { t: "Studio", l: ["About", "Team", "Press", "Careers"] },
            { t: "More", l: ["Journal", "FAQ", "Newsletter", "Contact"] },
            { t: "Legal", l: ["Privacy", "Terms", "Cookies"] },
          ].map((col) => (
            <div key={col.t}>
              <div style={{ fontFamily: brand.fontMono, fontSize: "0.65rem", letterSpacing: "0.2em", textTransform: "uppercase", color: brand.accent, marginBottom: 16 }}>
                {col.t}
              </div>
              <ul style={{ listStyle: "none", display: "grid", gap: 10 }}>
                {col.l.map((l) => (
                  <li key={l}>
                    <button style={{ color: brand.muted, fontSize: "0.88rem", textAlign: "left" }}>{l}</button>
                  </li>
                ))}
              </ul>
            </div>
          ))}
        </footer>
      );
    }

    /* =========================================================
       ROUTER
       ========================================================= */
    function BrandRouter({ brandId, route }) {
      const brand = BRANDS.find((b) => b.id === brandId);
      if (brandId === "pizza") {
        if (route === "Our Story" || route === "Locations" || route === "Reservations")
          return <PizzaPage route={route} brand={brand} />;
        return <PizzaHome brand={brand} />;
      }
      if (brandId === "fit") {
        if (route === "Programs" || route === "Coaches" || route === "Membership" || route === "Schedule")
          return <FitPage route={route} brand={brand} />;
        return <FitHome brand={brand} />;
      }
      if (brandId === "skin") {
        if (route === "Treatments" || route === "Products" || route === "Rituals" || route === "Book")
          return <SkinPage route={route} brand={brand} />;
        return <SkinHome brand={brand} />;
      }
      return null;
    }

    /* =========================================================
       APP
       ========================================================= */
    function App() {
      const [activeBrandId, setActiveBrandId] = useState("pizza");
      const [route, setRoute] = useState("Home");

      const brand = BRANDS.find((b) => b.id === activeBrandId);

      useEffect(() => {
        setRoute(brand.routes[0]);
      }, [activeBrandId]);

      useEffect(() => {
        document.body.style.background = brand.light;
        document.body.style.color = brand.text;
        document.body.style.transition = "background 0.4s ease, color 0.4s ease";
      }, [brand]);

      return (
        <div style={{ minHeight: "100vh" }}>
          <Sidebar
            brands={BRANDS}
            activeBrand={activeBrandId}
            onSwitchBrand={setActiveBrandId}
            activeRoute={route}
            onRouteChange={setRoute}
            brand={brand}
          />

          <MobileTopBar
            brands={BRANDS}
            activeBrand={activeBrandId}
            onSwitchBrand={setActiveBrandId}
            activeRoute={route}
            onRouteChange={setRoute}
            brand={brand}
          />

          <main
            className="main-shell"
            style={{
              paddingLeft: 280,
              minHeight: "100vh",
              background: brand.light,
              transition: "background 0.4s ease",
            }}
          >
            <div style={{ maxWidth: 1200, margin: "0 auto", padding: "48px 40px 80px" }}>
              <BrandRouter brandId={activeBrandId} route={route} />
              <Footer brand={brand} />
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
